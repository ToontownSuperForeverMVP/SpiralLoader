name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, verify Imlight patches (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SpiralLoader.sln -c Release

      - name: Test
        run: dotnet test SpiralLoader.sln -c Release --no-build

      - name: Verify Imlight patches (pinned commit)
        if: runner.os == 'Linux'
        run: integration/imlight/verify/verify-patch.sh

      - name: Verify Imlight patches (pinned commit)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./integration/imlight/verify/Verify-Patch.ps1

      - name: Verify Imlight patches (audited upstream quality-assurance commit)
        if: runner.os == 'Linux'
        env:
          IMLIGHT_COMMIT: 2a16010e59b95cc449d8e21542fbf38440e06bcf
        run: integration/imlight/verify/verify-patch.sh

      - name: Verify Imlight patches (audited upstream quality-assurance commit)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./integration/imlight/verify/Verify-Patch.ps1 -Commit 2a16010e59b95cc449d8e21542fbf38440e06bcf

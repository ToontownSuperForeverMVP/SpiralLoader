name: Feature request
description: Suggest a mod API or loader improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe compatibility, server/client scope, and behavior when no mods are installed.
    validations:
      required: true

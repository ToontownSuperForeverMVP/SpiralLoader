name: Bug report
description: Report a reproducible SpiralLoader issue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private logs, Wizard101 assets, client-derived data, or personal filesystem paths.
  - type: input
    id: revision
    attributes:
      label: SpiralLoader revision
      description: Commit hash or version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK, and Imlight commit if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include a minimal example with sensitive paths and data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
